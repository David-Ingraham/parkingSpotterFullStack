# Global Gradle properties (applies to all projects)

# Android properties
android.useAndroidX=true
android.enableJetifier=true

# Gradle daemon memory
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable caching
org.gradle.caching=true

# SSL/TLS settings - use Windows certificate store
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT
systemProp.https.protocols=TLSv1.2,TLSv1.3

# Disable SSL verification for Maven repos (TEMPORARY - for debugging only)
systemProp.javax.net.ssl.trustAll=true

